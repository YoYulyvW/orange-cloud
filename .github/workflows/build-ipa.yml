name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project "apps/ios/Orange Cloud/Orange Cloud.xcodeproj" \
            -scheme "Orange Cloud" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          echo "BUILD_EXIT=$?" >> $GITHUB_OUTPUT
      - name: Report
        if: always()
        run: |
          {
            echo "BUILD_EXIT=${{ steps.build.outputs.BUILD_EXIT }}"
            echo "=== errors ==="
            grep -E "error:" build.log | sort | uniq -c | sort -rn | head -200 || echo "no errors"
            echo "=== app info ==="
            APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
            if [ -n "$APP" ]; then
              echo "APP=$APP"
              /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" 2>&1 || true
              /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" 2>&1 || true
              ls -la "$APP" 2>&1
            else
              echo "NO APP"
            fi
            echo "=== tail ==="
            tail -60 build.log
          } > ci-status.txt 2>&1
          cat ci-status.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f ci-status.txt build.log
          git commit -m "ci: report [skip ci]" || echo "no changes"
          git push -f origin HEAD:ci-report || echo "push failed"
      - name: Package IPA
        if: steps.build.outputs.BUILD_EXIT == '0'
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r OrangeCloud-unsigned.ipa Payload
      - name: Upload IPA
        if: steps.build.outputs.BUILD_EXIT == '0'
        uses: actions/upload-artifact@v4
        with:
          name: OrangeCloud-unsigned-ipa
          path: OrangeCloud-unsigned.ipa