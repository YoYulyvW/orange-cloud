name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project "apps/ios/Orange Cloud/Orange Cloud.xcodeproj" \
            -scheme "Orange Cloud" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          echo "BUILD_EXIT=$?" >> $GITHUB_OUTPUT

      - name: Extract errors
        if: always()
        run: |
          echo "=== 编译错误汇总 ===" > ci-errors.txt
          grep -E "error:" build.log | sort | uniq -c | sort -rn | head -300 >> ci-errors.txt || echo "no errors" >> ci-errors.txt
          echo "" >> ci-errors.txt
          echo "=== 日志尾部 ===" >> ci-errors.txt
          tail -150 build.log >> ci-errors.txt || true
          wc -l ci-errors.txt

      - name: Commit errors back
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f ci-errors.txt build.log
          git commit -m "ci: build errors [skip ci]" || echo "no changes"
          git push origin HEAD:main || echo "push failed"

      - name: Package IPA
        if: steps.build.outputs.BUILD_EXIT == '0'
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r OrangeCloud-unsigned.ipa Payload

      - name: Upload IPA
        if: steps.build.outputs.BUILD_EXIT == '0'
        uses: actions/upload-artifact@v4
        with:
          name: OrangeCloud-unsigned-ipa
          path: OrangeCloud-unsigned.ipa