name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Diagnose project
        run: |
          echo "=== swift files in main app ==="
          find "apps/ios/Orange Cloud/Orange Cloud" -name "*.swift" | wc -l
          echo "=== list sources phase ==="
          xcodebuild -project "apps/ios/Orange Cloud/Orange Cloud.xcodeproj" -scheme "Orange Cloud" -showBuildSettings 2>/dev/null | grep -E "IPHONEOS_DEPLOYMENT_TARGET|SWIFT_ACTIVE_COMPILATION_CONDITIONS|SWIFT_VERSION" | head -20

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project "apps/ios/Orange Cloud/Orange Cloud.xcodeproj" \
            -scheme "Orange Cloud" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          echo "=== build tail ==="
          tail -100 build.log

      - name: Inspect output
        run: |
          echo "=== build products ==="
          find build/Build/Products -name "*.app" -maxdepth 3
          echo "=== app binary size ==="
          find build/Build/Products -name "Orange Cloud" -type f -exec ls -la {} \;
          echo "=== compiled object count ==="
          find build -name "*.o" | wc -l
          echo "=== swift compile units ==="
          grep -c "SwiftCompile" build.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
